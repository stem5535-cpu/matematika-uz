<!DOCTYPE html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Matematika O'rganish</title>
    <style>
      :root {
        --bg: #f4f7ff;
        --panel: #ffffff;
        --primary: #1d4ed8;
        --primary-soft: #dbeafe;
        --accent: #14b8a6;
        --success: #22c55e;
        --warning: #f59e0b;
        --danger: #ef4444;
        --text: #0f172a;
        --muted: #475569;
        --line: #e2e8f0;
        --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
        color: var(--text);
        background: linear-gradient(135deg, #eef6ff 0%, #f5f3ff 100%);
      }

      body {
        min-height: 100vh;
      }

      .app {
        max-width: 1280px;
        margin: 24px auto;
        display: grid;
        grid-template-columns: 300px 1fr;
        gap: 20px;
        padding: 0 16px 32px;
      }

      .sidebar,
      .main-panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 24px;
        box-shadow: var(--shadow);
      }

      .sidebar {
        padding: 20px 16px;
        height: fit-content;
        position: sticky;
        top: 20px;
      }

      .brand {
        font-size: 32px;
        font-weight: 800;
        color: var(--primary);
        margin: 0 0 10px;
        letter-spacing: 0.02em;
      }

      .subtitle {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.6;
        margin-bottom: 20px;
      }

      .nav-item {
        width: 100%;
        background: white;
        border: 1px solid transparent;
        border-radius: 14px;
        padding: 12px 14px;
        text-align: left;
        cursor: pointer;
        margin: 8px 0;
        font-size: 15px;
        font-weight: 700;
        color: var(--text);
        display: flex;
        justify-content: space-between;
        align-items: center;
        transition: 0.2s ease;
      }

      .nav-item:hover,
      .nav-item.active {
        background: var(--primary-soft);
        border-color: #bfdbfe;
        color: var(--primary);
      }

      .nav-count {
        background: #eef2ff;
        border-radius: 999px;
        padding: 4px 8px;
        font-size: 11px;
        color: var(--primary);
        font-weight: 700;
      }

      .main-panel {
        padding: 20px 20px 28px;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 18px;
        flex-wrap: wrap;
      }

      .title {
        font-size: 34px;
        margin: 0;
        color: var(--text);
      }

      .topic-chip {
        background: var(--primary-soft);
        color: var(--primary);
        border-radius: 999px;
        padding: 8px 12px;
        font-size: 12px;
        font-weight: 700;
      }

      .progress-box {
        background: #f8fafc;
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 12px 14px;
        margin-bottom: 20px;
      }

      .progress-header {
        font-weight: 700;
        margin-bottom: 10px;
      }

      .progress-bar {
        width: 100%;
        height: 12px;
        background: #e2e8f0;
        border-radius: 999px;
        overflow: hidden;
      }

      .progress-bar > span {
        display: block;
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, var(--primary), var(--accent));
        border-radius: inherit;
        transition: width 0.3s ease;
      }

      .topic-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 16px;
        margin-bottom: 22px;
      }

      .topic-card {
        background: linear-gradient(180deg, #fff, #f8fafc);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 16px;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .topic-card:hover {
        transform: translateY(-2px);
        box-shadow: var(--shadow);
      }

      .topic-card.active {
        border-color: #bfdbfe;
        background: #eff6ff;
      }

      .topic-card h3 {
        margin: 0 0 10px;
        font-size: 18px;
      }

      .topic-card ul {
        list-style: none;
        padding: 0;
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 13px;
        color: var(--muted);
      }

      .topic-card ul li::before {
        content: '• ';
        color: var(--accent);
        font-weight: bold;
      }

      .lesson-box {
        background: #f8fafc;
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 20px;
        margin-bottom: 22px;
      }

      .lesson-box h2 {
        margin: 0 0 16px;
        font-size: 28px;
        color: var(--primary);
      }

      .lesson-box p,
      .lesson-box li {
        font-size: 16px;
        line-height: 1.8;
        color: var(--text);
      }

      .example-box {
        background: white;
        border-left: 5px solid var(--accent);
        border-radius: 12px;
        border: 1px solid var(--line);
        padding: 16px 18px;
        margin: 18px 0;
        font-weight: 700;
        line-height: 1.7;
      }

      .quiz-box {
        background: linear-gradient(135deg, #ecfdf5, #ecfeff);
        border: 1px solid #bbf7d0;
        border-radius: 18px;
        padding: 20px;
      }

      .quiz-box h3 {
        margin: 0 0 10px;
        font-size: 24px;
        color: #0f766e;
      }

      .question {
        border-top: 1px solid rgba(15, 118, 110, 0.15);
        padding-top: 18px;
        margin-top: 18px;
      }

      .question strong {
        display: block;
        margin-bottom: 12px;
        font-size: 18px;
      }

      .option {
        display: block;
        width: 100%;
        background: white;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 12px 14px;
        cursor: pointer;
        text-align: left;
        margin: 8px 0;
        font-size: 15px;
        transition: 0.2s ease;
      }

      .option:hover {
        border-color: var(--primary);
        background: #eff6ff;
      }

      .option.correct {
        background: rgba(34, 197, 94, 0.12);
        border-color: var(--success);
        color: #166534;
        font-weight: 700;
      }

      .option.wrong {
        background: rgba(239, 68, 68, 0.08);
        border-color: var(--danger);
        color: #991b1b;
        font-weight: 700;
      }

      .check-btn {
        margin-top: 16px;
        background: var(--primary);
        color: white;
        border: none;
        border-radius: 12px;
        padding: 12px 18px;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
      }

      .result {
        margin-top: 18px;
        font-size: 18px;
        font-weight: 700;
      }

      @media (max-width: 900px) {
        .app {
          grid-template-columns: 1fr;
        }

        .sidebar {
          position: static;
        }

        .title {
          font-size: 28px;
        }
      }
    </style>
  </head>
  <body>

        <section class="quiz-box">

          <div id="quiz"></div>
        </section>
      </main>
    </div>

        }
      };

      const nav = document.getElementById("nav");
      const topicGrid = document.getElementById("topicGrid");
      const mainTitle = document.getElementById("mainTitle");
      const topicChip = document.getElementById("topicChip");
      const lessonTitle = document.getElementById("lessonTitle");
      const lessonContent = document.getElementById("lessonContent");
      const quizContainer = document.getElementById("quiz");
      const progressBar = document.getElementById("progressBar");

      let selectedCategory = "sonlar-va-arifmetika";
      let selectedSubtopic = 0;

      function renderNav() {
        nav.innerHTML = "";
        Object.entries(curriculum).forEach(([key, value]) => {
          const btn = document.createElement("button");
          btn.className = "nav-item" + (selectedCategory === key ? " active" : "");
          btn.innerHTML = `
            <span>${value.title}</span>
            <span class="nav-count">${value.subtopics.length}</span>
          `;
          btn.onclick = () => {
            selectedCategory = key;
            selectedSubtopic = 0;
            render();
          };
          nav.appendChild(btn);
        });
      }

      function renderTopicGrid() {
        topicGrid.innerHTML = "";
        const items = curriculum[selectedCategory].subtopics;

        items.forEach((item, index) => {
          const card = document.createElement("div");
          card.className = "topic-card" + (index === selectedSubtopic ? " active" : "");
          card.innerHTML = `
            <h3>${item.name}</h3>
            <ul>
              <li>Asosiy tushuncha</li>
              <li>Misol</li>
              <li>Amaliy mashq</li>
            </ul>
          `;
          card.onclick = () => {
            selectedSubtopic = index;
            render();
          };
          topicGrid.appendChild(card);
        });
      }

      function renderLesson() {
        const category = curriculum[selectedCategory];
        const topic = category.subtopics[selectedSubtopic];
        mainTitle.textContent = category.title;
        topicChip.textContent = `${category.title} · ${category.subtopics.length} mavzu`;
        lessonTitle.textContent = topic.name;
        lessonContent.innerHTML = topic.lesson;
      }

      function renderProgress() {
        const keys = Object.keys(curriculum);
        const currentIndex = keys.indexOf(selectedCategory);
        const progressPercent = ((currentIndex + 1) / keys.length) * 100;
        progressBar.style.width = `${progressPercent}%`;
      }

      function renderQuiz() {
        const quizData = [
          { q: "12 + 7 = ?", options: ["17", "19", "18", "20"], correct: "19" },
          { q: "5² ni hisoblang.", options: ["10", "25", "15", "20"], correct: "25" },
          { q: "3/4 + 1/4 = ?", options: ["1/2", "1", "3/8", "4/4"], correct: "1" },
          { q: "√16 = ?", options: ["4", "8", "2", "16"], correct: "4" },
          { q: "2x + 3 = 11 tenglamada x = ?", options: ["3", "4", "5", "2"], correct: "4" }
        ];

        quizContainer.innerHTML = "";

        quizData.forEach((item, index) => {
          const wrap = document.createElement("div");
          wrap.className = "question";

          const qText = document.createElement("strong");
          qText.textContent = `${index + 1}. ${item.q}`;
          wrap.appendChild(qText);

          item.options.forEach(opt => {
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = "option";
            btn.textContent = opt;
            btn.onclick = () => {
              const options = wrap.querySelectorAll(".option");
              options.forEach(el => {
                el.classList.remove("correct", "wrong");
              });

              if (opt === item.correct) {
                btn.classList.add("correct");
              } else {
                btn.classList.add("wrong");
                options.forEach(el => {
                  if (el.textContent === item.correct) el.classList.add("correct");
                });
              }
            };
            wrap.appendChild(btn);
          });

          quizContainer.appendChild(wrap);
        });

        const button = document.createElement("button");
        button.className = "check-btn";
        button.textContent = "Javoblarni tekshirish";
        button.onclick = () => {
          const allQuestions = quizContainer.querySelectorAll(".question");
          let correctCount = 0;

          allQuestions.forEach(questionWrap => {
            const chosen = questionWrap.querySelector(".option.correct");
            if (chosen) correctCount++;
          });

          const result = document.createElement("div");
          result.className = "result";
          result.textContent = `Siz ${correctCount} ta to'g'ri javob berdingiz.`;

          const oldResult = document.querySelector(".result");
          if (oldResult) oldResult.remove();

          quizContainer.appendChild(result);
        };

        quizContainer.appendChild(button);
      }

      function render() {
        renderNav();
        renderTopicGrid();
        renderLesson();
        renderProgress();
        renderQuiz();
      }

      render();
    </script>
  </body>
</html>
